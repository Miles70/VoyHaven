<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <link rel="icon" type="image/svg+xml" href="/brand/voyhaven-favicon.svg" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <meta name="theme-color" content="#082b4f" />
    <meta
      name="description"
      content="VoyHaven Travel — search hotels, compare live room offers and book global stays."

    <link rel="canonical" href="https://voyhaven.com/en" />
    <title>VoyHaven Travel | Hotels & Global Stays</title>
    <style>
      #root > .appBoot {
        position: fixed;
        inset: 0;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 18px;
        background: #f7f2e8;
        color: #122c40;
        font: 650 28px/1.2 Inter, Arial, sans-serif;
      }
      .appBoot img { width: 48px; height: 48px; }
      .appBootProgress {
        width: 96px;
        height: 3px;
        border-radius: 3px;
        background: linear-gradient(90deg, #13b8a6 0 50%, #dce5df 50%);
      }
    </style>
  </head>

  <body>
    <div id="root">
      <div class="appBoot" role="status" aria-label="VoyHaven">
        <img src="/brand/voyhaven-favicon.svg" alt="" width="48" height="48" />
        <span>VoyHaven</span>
        <span class="appBootProgress" aria-hidden="true"></span>
      </div>
      <noscript>
        <style>.appBoot { display: none !important; }</style>
        <main><h1>VoyHaven Travel — Hotels and Flights</h1><p>Explore hotels and flight routes, then choose your travel dates to compare current options.</p><nav aria-label="Travel"><a href="/en/hotels">Hotels</a> · <a href="/en/flights">Flights</a> · <a href="/en/hotels/antalya">Hotels in Antalya</a></nav><nav aria-label="Languages"><a href="/tr">Türkçe</a> · <a href="/en">English</a> · <a href="/de">Deutsch</a> · <a href="/fr">Français</a> · <a href="/ru">Русский</a> · <a href="/ar">العربية</a> · <a href="/es">Español</a> · <a href="/pt">Português</a> · <a href="/it">Italiano</a> · <a href="/zh">中文</a></nav></main>
      </noscript>
    </div>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
